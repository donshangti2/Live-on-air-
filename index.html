<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Kulzzy Radio - Live Community</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#001a3a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#kulzzyLiveCommunity{
  width:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

#kulzzyLiveCommunity *,
#kulzzyLiveCommunity *::before,
#kulzzyLiveCommunity *::after{
  box-sizing:border-box;
}

.kulzzy-container{
  width:100%;
  max-width:650px;
  margin:0 auto;
  padding:20px;
}

.kulzzy-community-box{
  width:100%;
  background:#062b57;
  border-radius:28px;
  padding:40px 30px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.kulzzy-live-badge{
  display:table;
  margin:0 auto 35px;
  background:#f30000;
  color:#fff;
  padding:13px 25px;
  border-radius:40px;
  font-weight:bold;
  font-size:18px;
}

.kulzzy-live-dot{
  display:inline-block;
  width:15px;
  height:15px;
  background:#fff;
  border-radius:50%;
  margin-right:10px;
}

.kulzzy-title{
  text-align:center;
  font-size:45px;
  line-height:1.1;
  margin:0 0 25px;
}

.kulzzy-yellow{
  color:#ffd000;
}

.kulzzy-description{
  text-align:center;
  color:#c7d5e8;
  font-size:19px;
  line-height:1.6;
  margin:0 0 35px;
}

.kulzzy-label{
  display:block;
  font-weight:bold;
  font-size:16px;
  margin:0 0 10px;
}

#kulzzyLiveCommunity .kulzzy-phone{
  width:100%;
  padding:18px;
  border-radius:15px;
  border:1px solid #46688f;
  background:#001d40;
  color:#fff;
  font-size:18px;
  outline:none;
}

#kulzzyLiveCommunity .kulzzy-phone:focus{
  border-color:#ffd000;
}

.kulzzy-join-button{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#ffd000;
  color:#001a3a;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.kulzzy-join-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.kulzzy-error{
  min-height:20px;
  color:#ff8d8d;
  margin-top:15px;
  text-align:center;
  font-size:14px;
  line-height:1.4;
}

.kulzzy-status-box{
  margin-top:25px;
  background:#001d40;
  border:1px solid #46688f;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
}

.kulzzy-status-icon{
  font-size:55px;
  margin-bottom:12px;
}

.kulzzy-status-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:10px;
}

.kulzzy-status-text{
  color:#c7d5e8;
  font-size:17px;
  line-height:1.5;
}

.kulzzy-mic-controls{
  margin-top:25px;
  text-align:center;
}

.kulzzy-mic-button{
  width:100%;
  padding:20px;
  border:0;
  border-radius:16px;
  background:#ffd000;
  color:#001a3a;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.kulzzy-mic-button:active{
  transform:scale(.98);
}

.kulzzy-mic-button.muted{
  background:#d40000;
  color:#fff;
}

.kulzzy-mic-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.kulzzy-mic-status{
  margin-top:12px;
  color:#c7d5e8;
  font-size:14px;
  line-height:1.5;
}

.kulzzy-hidden{
  display:none !important;
}

.kulzzy-footer{
  text-align:center;
  color:#8198b7;
  font-size:14px;
  margin-top:30px;
}

@media(max-width:600px){

  .kulzzy-container{
    padding:12px;
  }

  .kulzzy-community-box{
    padding:35px 20px;
    border-radius:24px;
  }

  .kulzzy-title{
    font-size:38px;
  }

  .kulzzy-description{
    font-size:17px;
  }

  .kulzzy-live-badge{
    font-size:16px;
  }

}

</style>

</head>


<body>

<div id="kulzzyLiveCommunity">

  <div class="kulzzy-container">

    <main class="kulzzy-community-box">

      <div class="kulzzy-live-badge">
        <span class="kulzzy-live-dot"></span>
      </div>


      <h1 class="kulzzy-title">

        Join
        <span class="kulzzy-yellow">
          Kulzzy Radio
        </span>

      </h1>


      <!-- JOIN AREA -->

      <div id="joinArea">

        <label
          class="kulzzy-label"
          for="phoneNumber"
        >
          Your Phone Number
        </label>


        <input
          class="kulzzy-phone"
          type="tel"
          id="phoneNumber"
          placeholder="+2349017759411"
          autocomplete="tel"
          inputmode="tel"
        >


        <button
          type="button"
          class="kulzzy-join-button"
          id="joinButton"
        >
          🎙️ JOIN US LIVE ON-AIR 
        </button>


        <div
          class="kulzzy-error"
          id="errorMessage"
        ></div>

      </div>


      <!-- STATUS -->

      <div
        class="kulzzy-status-box kulzzy-hidden"
        id="statusBox"
      >

        <div
          class="kulzzy-status-icon"
          id="statusIcon"
        >
          ⏳
        </div>


        <div
          class="kulzzy-status-title"
          id="statusTitle"
        >
          You're in the queue
        </div>


        <div
          class="kulzzy-status-text"
          id="statusText"
        >
          You are connected.
          Please wait for the host
          to allow you to speak.
        </div>


        <!-- MICROPHONE -->

        <div
          class="kulzzy-mic-controls kulzzy-hidden"
          id="micControls"
        >

          <button
            type="button"
            class="kulzzy-mic-button"
            id="micButton"
          >
            🎙️ START TALKING
          </button>


          <div
            class="kulzzy-mic-status"
            id="micStatus"
          >
            Tap the button to start talking on-air.
          </div>

        </div>

      </div>


    </main>

  </div>

</div>


<script type="module">

/*
=========================================================
KULZZY RADIO NETWORK
LIVE COMMUNITY
GITHUB VERSION

IMPORTANT:

DO NOT CHANGE firebase.js
DO NOT CHANGE webrtc.js

This index.html uses:

./js/firebase.js
./js/webrtc.js
=========================================================
*/


import {
  auth,
  db
} from "./js/firebase.js";


import {
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  ref,
  update,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
  connectCaller,
  muteLocalMicrophone,
  closeWebRTC
} from "./js/webrtc.js";



/*
=========================================================
ELEMENTS
=========================================================
*/

const phoneInput =
  document.getElementById("phoneNumber");

const joinButton =
  document.getElementById("joinButton");

const joinArea =
  document.getElementById("joinArea");

const statusBox =
  document.getElementById("statusBox");

const statusIcon =
  document.getElementById("statusIcon");

const statusTitle =
  document.getElementById("statusTitle");

const statusText =
  document.getElementById("statusText");

const errorMessage =
  document.getElementById("errorMessage");

const micControls =
  document.getElementById("micControls");

const micButton =
  document.getElementById("micButton");

const micStatus =
  document.getElementById("micStatus");



/*
=========================================================
VARIABLES
=========================================================
*/

let currentUser = null;

let callerUid = null;

let callerRef = null;

let callerUnsubscribe = null;

let callerListenerStarted = false;

let currentPhone = null;

let microphoneMuted = true;

let webRTCConnected = false;

let firebaseReady = false;



/*
=========================================================
FIREBASE AUTH READY PROMISE
=========================================================

This prevents the JOIN button from being pressed
before Firebase anonymous authentication is ready.
=========================================================
*/

let resolveFirebaseReady;

const firebaseReadyPromise =
  new Promise((resolve) => {

    resolveFirebaseReady = resolve;

  });



/*
=========================================================
ERROR
=========================================================
*/

function showError(message){

  if(errorMessage){

    errorMessage.textContent =
      message;

  }

}


function clearError(){

  if(errorMessage){

    errorMessage.textContent =
      "";

  }

}



/*
=========================================================
PHONE NORMALIZATION
=========================================================
*/

function normalizePhone(phone){

  let value =
    String(phone || "")
      .trim()
      .replace(/[^\d+]/g,"");


  if(
    value.startsWith("0") &&
    value.length >= 10
  ){

    value =
      "+234" +
      value.substring(1);

  }


  if(
    value.startsWith("234") &&
    !value.startsWith("+234")
  ){

    value =
      "+" +
      value;

  }


  return value;

}



/*
=========================================================
CALLER ID
=========================================================
*/

function createCallerId(phone){

  const normalized =
    normalizePhone(phone);

  const digits =
    normalized.replace(/\D/g,"");

  return "caller_" + digits;

}



/*
=========================================================
SHOW STATUS
=========================================================
*/

function showStatus(
  icon,
  title,
  text
){

  statusIcon.textContent =
    icon;

  statusTitle.textContent =
    title;

  statusText.textContent =
    text;

  statusBox.classList.remove(
    "kulzzy-hidden"
  );

}



/*
=========================================================
MICROPHONE UI
=========================================================
*/

function showMicControls(){

  micControls.classList.remove(
    "kulzzy-hidden"
  );

  microphoneMuted = true;

  updateMicButton();

}


function hideMicControls(){

  micControls.classList.add(
    "kulzzy-hidden"
  );

}


function updateMicButton(){

  if(!micButton){
    return;
  }


  if(microphoneMuted){

    micButton.classList.remove(
      "muted"
    );

    micButton.textContent =
      "🎙️ START TALKING";


    micStatus.textContent =
      "Tap the button to start talking on-air.";

  }

  else{

    micButton.classList.add(
      "muted"
    );

    micButton.textContent =
      "🔇 MUTE MICROPHONE";


    micStatus.textContent =
      "Your microphone is ON. You are talking on-air.";

  }

}



/*
=========================================================
UPDATE CALLER STATUS
=========================================================
*/

function updateCallerStatus(caller){

  if(!caller){
    return;
  }


  /*
  DISCONNECTED
  */

  if(
    caller.status === "disconnected" ||
    caller.online === false
  ){

    showStatus(

      "❌",

      "Disconnected",

      "The host has disconnected you. You can join again when invited."

    );

    hideMicControls();

    return;

  }


  /*
  HOST ALLOWED
  */

  if(
    caller.allowedToSpeak === true
  ){

    showStatus(

      "🎙️",

      "YOU ARE LIVE!",

      "The host has allowed you to speak. Tap the microphone button below to start talking on-air."

    );

    showMicControls();

    return;

  }


  /*
  WAITING
  */

  showStatus(

    "⏳",

    "You're in the queue",

    "You are connected. Please wait for the host to allow you to speak."

  );

  hideMicControls();

}



/*
=========================================================
CALLER LISTENER
=========================================================
*/

function stopCallerListener(){

  if(callerUnsubscribe){

    try{

      callerUnsubscribe();

    }

    catch(error){

      console.error(
        "Listener stop error:",
        error
      );

    }

  }

  callerUnsubscribe = null;

  callerListenerStarted = false;

}


function startCallerListener(){

  if(
    callerListenerStarted ||
    !callerRef
  ){

    return;

  }


  callerListenerStarted = true;


  callerUnsubscribe =

    onValue(

      callerRef,

      (snapshot) => {

        const caller =
          snapshot.val();


        if(caller){

          updateCallerStatus(
            caller
          );

        }

      },

      (error) => {

        console.error(
          "Firebase caller listener error:",
          error
        );

        callerListenerStarted =
          false;

      }

    );

}



/*
=========================================================
MARK CALLER OFFLINE
=========================================================
*/

async function markCurrentCallerOffline(){

  if(!callerRef){
    return;
  }


  try{

    await update(

      callerRef,

      {

        online:false,

        status:"offline",

        muted:true,

        allowedToSpeak:false,

        lastSeen:Date.now()

      }

    );

  }

  catch(error){

    console.error(
      "Offline update error:",
      error
    );

  }

}



/*
=========================================================
REGISTER CALLER
=========================================================
*/

async function registerCaller(){

  clearError();


  /*
  WAIT FOR FIREBASE AUTH
  */

  if(!currentUser){

    showError(
      "Connecting to the live system..."
    );


    try{

      await Promise.race([

        firebaseReadyPromise,

        new Promise((_,reject) => {

          setTimeout(

            () => reject(
              new Error(
                "Firebase authentication timeout"
              )
            ),

            10000

          );

        })

      ]);

    }

    catch(error){

      console.error(
        "Firebase ready error:",
        error
      );

      showError(
        "Unable to connect to the live system. Please refresh the page and try again."
      );

      return;

    }

  }


  if(!currentUser){

    showError(
      "Unable to connect to the live system. Please refresh the page and try again."
    );

    return;

  }


  /*
  PHONE
  */

  const phone =
    normalizePhone(
      phoneInput.value
    );


  if(!phone){

    showError(
      "Please enter your phone number."
    );

    return;

  }


  if(phone.length < 10){

    showError(
      "Please enter a valid phone number."
    );

    return;

  }


  /*
  CREATE CALLER
  */

  const newCallerUid =
    createCallerId(phone);


  /*
  IF NUMBER CHANGED
  */

  if(
    callerRef &&
    callerUid &&
    callerUid !== newCallerUid
  ){

    await markCurrentCallerOffline();

    stopCallerListener();

  }


  callerUid =
    newCallerUid;


  currentPhone =
    phone;


  callerRef =
    ref(
      db,
      "callers/" +
      callerUid
    );


  /*
  BUTTON
  */

  joinButton.disabled =
    true;

  joinButton.textContent =
    "CONNECTING...";


  try{

    const now =
      Date.now();


    /*
    SAVE CALLER
    */

    await update(

      callerRef,

      {

        phone:phone,

        status:"waiting",

        muted:true,

        allowedToSpeak:false,

        online:true,

        lastSeen:now,

        joinedAt:now

      }

    );


    /*
    AUTO OFFLINE
    */

    const disconnect =
      onDisconnect(
        callerRef
      );


    await disconnect.update({

      online:false,

      status:"offline",

      muted:true,

      allowedToSpeak:false,

      lastSeen:Date.now()

    });


    /*
    SAVE PHONE
    */

    try{

      localStorage.setItem(
        "kulzzy_live_phone",
        phone
      );

      localStorage.setItem(
        "kulzzy_live_caller_uid",
        callerUid
      );

    }

    catch(storageError){

      console.log(
        "Local storage unavailable:",
        storageError
      );

    }


    /*
    SHOW PHONE
    */

    phoneInput.value =
      phone;


    /*
    HIDE JOIN AREA
    */

    joinArea.classList.add(
      "kulzzy-hidden"
    );


    /*
    SHOW WAITING
    */

    showStatus(

      "⏳",

      "You're in the queue",

      "You are connected. Please wait for the host to allow you to speak."

    );


    hideMicControls();


    /*
    LISTEN FOR HOST
    */

    startCallerListener();


    console.log(
      "===================================="
    );

    console.log(
      "KULZZY CALLER REGISTERED"
    );

    console.log(
      "Phone:",
      phone
    );

    console.log(
      "Caller ID:",
      callerUid
    );

    console.log(
      "Firebase path:",
      "callers/" + callerUid
    );

    console.log(
      "===================================="
    );

  }

  catch(error){

    console.error(
      "CALLER REGISTRATION ERROR:",
      error
    );


    joinButton.disabled =
      false;

    joinButton.textContent =
      "🎙️ JOIN LIVE";


    /*
    SHOW REALISTIC ERROR
    */

    let message =
      "Unable to connect to the live system. Please try again.";


    if(
      error &&
      (
        error.code ===
        "PERMISSION_DENIED" ||
        String(error.message || "")
          .toLowerCase()
          .includes("permission")
      )
    ){

      message =
        "Firebase permission denied. Please check your Firebase Realtime Database rules.";

    }


    showError(message);

  }

}



/*
=========================================================
MICROPHONE
=========================================================
*/

async function toggleMicrophone(){

  clearError();


  if(!callerUid){

    showError(
      "Please join the live community first."
    );

    return;

  }


  try{

    /*
    FIRST CONNECTION
    */

    if(!webRTCConnected){

      micButton.disabled =
        true;

      micButton.textContent =
        "🎙️ CONNECTING...";


      micStatus.textContent =
        "Connecting your microphone to the host...";


      await connectCaller(
        callerUid
      );


      webRTCConnected =
        true;


      microphoneMuted =
        false;


      updateMicButton();


      await update(

        callerRef,

        {

          muted:false,

          allowedToSpeak:true,

          status:"speaking",

          online:true

        }

      );


      console.log(
        "Caller WebRTC connected."
      );


      return;

    }


    /*
    TOGGLE MUTE
    */

    microphoneMuted =
      !microphoneMuted;


    muteLocalMicrophone(
      microphoneMuted
    );


    await update(

      callerRef,

      {

        muted:
          microphoneMuted,

        allowedToSpeak:
          !microphoneMuted,

        status:
          microphoneMuted
            ? "muted"
            : "speaking"

      }

    );


    updateMicButton();

  }

  catch(error){

    console.error(
      "MICROPHONE / WEBRTC ERROR:",
      error
    );


    webRTCConnected =
      false;

    microphoneMuted =
      true;


    micButton.disabled =
      false;


    updateMicButton();


    if(
      error &&
      error.name ===
      "NotAllowedError"
    ){

      showError(
        "Microphone permission was denied. Please allow microphone access and try again."
      );

    }

    else if(
      error &&
      error.name ===
      "NotFoundError"
    ){

      showError(
        "No microphone was found on this device."
      );

    }

    else{

      showError(
        "Unable to connect your microphone. Please try again."
      );

    }


    micStatus.textContent =
      "Microphone connection failed. Please try again.";

  }

  finally{

    micButton.disabled =
      false;

  }

}



/*
=========================================================
JOIN BUTTON
=========================================================
*/

joinButton.addEventListener(

  "click",

  function(){

    registerCaller();

  }

);



/*
=========================================================
ENTER KEY
=========================================================
*/

phoneInput.addEventListener(

  "keydown",

  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      registerCaller();

    }

  }

);



/*
=========================================================
MIC BUTTON
=========================================================
*/

micButton.addEventListener(

  "click",

  function(){

    toggleMicrophone();

  }

);



/*
=========================================================
FIREBASE AUTHENTICATION
=========================================================
*/

onAuthStateChanged(

  auth,

  async function(user){

    /*
    USER AUTHENTICATED
    */

    if(user){

      currentUser =
        user;

      firebaseReady =
        true;


      console.log(
        "Firebase authentication ready:",
        user.uid
      );


      resolveFirebaseReady();


      /*
      LOAD SAVED PHONE
      */

      try{

        const savedPhone =
          localStorage.getItem(
            "kulzzy_live_phone"
          );


        if(
          savedPhone &&
          !currentPhone
        ){

          phoneInput.value =
            savedPhone;

        }

      }

      catch(error){

        console.log(
          "Unable to load saved phone:",
          error
        );

      }


      console.log(
        "Kulzzy Live Community is ready."
      );


      return;

    }


    /*
    NO USER
    */

    currentUser =
      null;

    firebaseReady =
      false;


    console.log(
      "No Firebase anonymous user."
    );


    /*
    SIGN IN ANONYMOUSLY
    */

    try{

      await signInAnonymously(
        auth
      );


      console.log(
        "Firebase anonymous authentication started."
      );

    }

    catch(error){

      console.error(
        "Firebase anonymous authentication error:",
        error
      );


      showError(
        "Unable to connect to the live system. Please refresh the page and try again."
      );

    }

  }

);



/*
=========================================================
PAGE CLEANUP
=========================================================
*/

window.addEventListener(

  "beforeunload",

  function(){

    try{

      if(callerRef){

        update(

          callerRef,

          {

            online:false,

            status:"offline",

            muted:true,

            allowedToSpeak:false,

            lastSeen:Date.now()

          }

        );

      }

      if(webRTCConnected){

        closeWebRTC(
          callerUid
        );

      }

    }

    catch(error){

      console.log(
        "Cleanup error:",
        error
      );

    }

  }

);



/*
=========================================================
STARTUP
=========================================================
*/

console.log(
  "===================================="
);

console.log(
  "KULZZY RADIO NETWORK"
);

console.log(
  "LIVE COMMUNITY"
);

console.log(
  "GITHUB VERSION"
);

console.log(
  "Firebase + WebRTC enabled"
);

console.log(
  "===================================="
);

</script>

</body>

</html>
