<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kulzzy Radio - Live Community</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #001a3a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .community-box {
      background: #062b57;
      border-radius: 28px;
      padding: 40px 30px;
      margin: 80px auto 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .live-badge {
      display: table;
      margin: 0 auto 35px;
      background: #f30000;
      color: #ffffff;
      padding: 13px 25px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 18px;
    }

    .live-dot {
      display: inline-block;
      width: 15px;
      height: 15px;
      background: #ffffff;
      border-radius: 50%;
      margin-right: 10px;
    }

    h1 {
      text-align: center;
      font-size: 45px;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    .yellow {
      color: #ffd000;
    }

    .description {
      text-align: center;
      color: #c7d5e8;
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid #46688f;
      background: #001d40;
      color: #ffffff;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #ffd000;
    }

    .join-button {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #ffd000;
      color: #001a3a;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .join-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 25px;
      background: #001d40;
      border: 1px solid #46688f;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
    }

    .status-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .status-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-text {
      color: #c7d5e8;
      font-size: 17px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .error {
      color: #ff8d8d;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #8198b7;
      font-size: 14px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .community-box {
        margin-top: 40px;
        padding: 35px 20px;
      }

      h1 {
        font-size: 38px;
      }

      .description {
        font-size: 17px;
      }

      .live-badge {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <main class="community-box">

    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE COMMUNITY
    </div>

    <h1>
      Join <span class="yellow">Kulzzy Radio</span>
    </h1>

    <p class="description">
      Join us live and get the opportunity to speak on-air.
      Enter your phone number below to join the waiting queue.
    </p>


    <!-- PHONE FORM -->

    <div id="joinArea">

      <label for="phoneNumber">
        Your Phone Number
      </label>

      <input
        type="tel"
        id="phoneNumber"
        placeholder="+2349017759411"
        autocomplete="tel"
      >

      <button
        class="join-button"
        id="joinButton"
      >
        🎙️ JOIN LIVE
      </button>

      <div
        class="error"
        id="errorMessage"
      ></div>

    </div>


    <!-- STATUS -->

    <div
      class="status-box hidden"
      id="statusBox"
    >

      <div
        class="status-icon"
        id="statusIcon"
      >
        ⏳
      </div>

      <div
        class="status-title"
        id="statusTitle"
      >
        You're in the queue
      </div>

      <div
        class="status-text"
        id="statusText"
      >
        You are connected. Please wait for the host to allow you to speak.
      </div>

    </div>


    <div class="footer">
      Kulzzy Radio Network • Celebrating Lives Everyday
    </div>

  </main>

</div>


<script type="module">

  // =====================================================
  // KULZZY RADIO NETWORK
  // LIVE COMMUNITY
  // =====================================================

  import {
    auth,
    db
  } from "./js/firebase.js";

  import {
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    ref,
    set,
    update,
    onValue,
    onDisconnect
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // =====================================================
  // ELEMENTS
  // =====================================================

  const phoneInput =
    document.getElementById("phoneNumber");

  const joinButton =
    document.getElementById("joinButton");

  const joinArea =
    document.getElementById("joinArea");

  const statusBox =
    document.getElementById("statusBox");

  const statusIcon =
    document.getElementById("statusIcon");

  const statusTitle =
    document.getElementById("statusTitle");

  const statusText =
    document.getElementById("statusText");

  const errorMessage =
    document.getElementById("errorMessage");


  // =====================================================
  // VARIABLES
  // =====================================================

  let currentUser = null;

  let callerUid = null;

  let callerRef = null;

  let callerListenerStarted = false;


  // =====================================================
  // PHONE NORMALIZATION
  // =====================================================

  function normalizePhone(phone) {

    let value =
      String(phone || "")
        .trim()
        .replace(/[^\d+]/g, "");


    // Convert Nigerian 080... format to +23480...
    if (
      value.startsWith("0") &&
      value.length >= 10
    ) {

      value =
        "+234" +
        value.substring(1);

    }


    // Convert 234... to +234...
    if (
      value.startsWith("234") &&
      !value.startsWith("+234")
    ) {

      value =
        "+" +
        value;

    }


    return value;

  }


  // =====================================================
  // CREATE A SAFE LOCAL CALLER ID
  // =====================================================

  function getStoredCallerId() {

    const key =
      "kulzzy_live_caller_uid";


    let stored =
      localStorage.getItem(key);


    if (stored) {

      return stored;

    }


    if (
      window.crypto &&
      crypto.randomUUID
    ) {

      stored =
        crypto.randomUUID();

    } else {

      stored =
        "caller_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);

    }


    localStorage.setItem(
      key,
      stored
    );


    return stored;

  }


  // =====================================================
  // ERROR
  // =====================================================

  function showError(message) {

    errorMessage.textContent =
      message;

  }


  function clearError() {

    errorMessage.textContent =
      "";

  }


  // =====================================================
  // SHOW STATUS
  // =====================================================

  function showStatus(
    icon,
    title,
    text
  ) {

    statusIcon.textContent =
      icon;

    statusTitle.textContent =
      title;

    statusText.textContent =
      text;

    statusBox.classList.remove(
      "hidden"
    );

  }


  // =====================================================
  // UPDATE STATUS FROM FIREBASE
  // =====================================================

  function updateCallerStatus(caller) {

    if (!caller) {
      return;
    }


    // ================================================
    // DISCONNECTED
    // ================================================

    if (
      caller.status ===
      "disconnected"
    ) {

      showStatus(
        "❌",
        "Disconnected",
        "The host has disconnected you. You can join again when invited."
      );

      return;

    }


    // ================================================
    // ALLOWED TO SPEAK
    // ================================================

    if (
      caller.allowedToSpeak === true &&
      caller.muted === false
    ) {

      showStatus(
        "🎙️",
        "You are allowed to speak",
        "The host has allowed your microphone. Follow the microphone instructions to speak on-air."
      );

      return;

    }


    // ================================================
    // MUTED
    // ================================================

    if (
      caller.muted === true
    ) {

      showStatus(
        "🔇",
        "You're in the queue",
        "You are connected. Please wait for the host to allow you to speak."
      );

      return;

    }


    // ================================================
    // DEFAULT
    // ================================================

    showStatus(
      "⏳",
      "You're in the queue",
      "You are connected. Please wait for the host to allow you to speak."
    );

  }


  // =====================================================
  // WATCH CALLER
  // =====================================================

  function startCallerListener() {

    if (
      callerListenerStarted ||
      !callerRef
    ) {

      return;

    }


    callerListenerStarted =
      true;


    onValue(
      callerRef,
      (snapshot) => {

        const caller =
          snapshot.val();


        if (caller) {

          updateCallerStatus(
            caller
          );

        }

      }
    );

  }


  // =====================================================
  // REGISTER / REJOIN CALLER
  // =====================================================

  async function registerCaller() {

    if (!currentUser) {

      showError(
        "Connecting to the live system. Please wait a moment and try again."
      );

      return;

    }


    const phone =
      normalizePhone(
        phoneInput.value
      );


    if (!phone) {

      showError(
        "Please enter your phone number."
      );

      return;

    }


    if (
      phone.length < 10
    ) {

      showError(
        "Please enter a valid phone number."
      );

      return;

    }


    clearError();


    joinButton.disabled =
      true;

    joinButton.textContent =
      "CONNECTING...";


    try {

      /*
       * IMPORTANT:
       *
       * We reuse the same Firebase
       * Authentication UID every time
       * this browser joins.
       *
       * Therefore:
       *
       * caller UID
       * remains the same
       *
       * instead of creating another
       * caller record.
       */

      callerUid =
        currentUser.uid;


      callerRef =
        ref(
          db,
          "callers/" +
          callerUid
        );


      // ===============================================
      // SAVE / REJOIN EXISTING CALLER
      // ===============================================

      await update(
        callerRef,
        {

          phone:
            phone,

          status:
            "waiting",

          muted:
            true,

          allowedToSpeak:
            false,

          online:
            true,

          lastSeen:
            Date.now(),

          joinedAt:
            Date.now()

        }
      );


      /*
       * If the browser disconnects,
       * Firebase automatically marks
       * this caller offline.
       */

      await onDisconnect(
        callerRef
      ).update({

        online:
          false,

        status:
          "offline",

        muted:
          true,

        allowedToSpeak:
          false,

        lastSeen:
          Date.now()

      });


      phoneInput.value =
        phone;


      joinArea.classList.add(
        "hidden"
      );


      showStatus(
        "⏳",
        "You're in the queue",
        "You are connected. Please wait for the host to allow you to speak."
      );


      startCallerListener();


      console.log(
        "Kulzzy caller registered:",
        callerUid,
        phone
      );


    } catch (error) {

      console.error(
        "Caller registration error:",
        error
      );


      showError(
        "Unable to connect to the live system. Please try again."
      );


      joinButton.disabled =
        false;

      joinButton.textContent =
        "🎙️ JOIN LIVE";

    }

  }


  // =====================================================
  // JOIN BUTTON
  // =====================================================

  joinButton.addEventListener(
    "click",
    registerCaller
  );


  phoneInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key ===
        "Enter"
      ) {

        registerCaller();

      }

    }
  );


  // =====================================================
  // AUTHENTICATION
  // =====================================================

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        currentUser =
          user;


        console.log(
          "Caller Firebase authentication ready:",
          user.uid
        );


        /*
         * If this browser already has
         * a caller session, reconnect
         * automatically.
         */

        const savedPhone =
          localStorage.getItem(
            "kulzzy_live_phone"
          );


        if (
          savedPhone &&
          !callerUid
        ) {

          phoneInput.value =
            savedPhone;

        }


        joinButton.disabled =
          false;

        joinButton.textContent =
          "🎙️ JOIN LIVE";


      } else {

        try {

          await signInAnonymously(
            auth
          );

        } catch (error) {

          console.error(
            "Anonymous Firebase login error:",
            error
          );


          showError(
            "Unable to connect to the live system."
          );

        }

      }

    }
  );


  // =====================================================
  // SAVE PHONE LOCALLY
  // =====================================================

  phoneInput.addEventListener(
    "change",
    () => {

      const phone =
        normalizePhone(
          phoneInput.value
        );


      if (phone) {

        localStorage.setItem(
          "kulzzy_live_phone",
          phone
        );

      }

    }
  );


  // =====================================================
  // INITIALIZE
  // =====================================================

  getStoredCallerId();


  console.log(
    "🎙️ Kulzzy Radio Live Community loaded."
  );

</script>

</body>
</html>
